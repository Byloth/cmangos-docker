name: cmangos
services:
  mariadb:
    image: mariadb:11.8
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "${MARIADB_CPUS_LIMIT:-0}"
          memory: "${MARIADB_MEMORY_LIMIT:-2g}"

    environment:
      MARIADB_ROOT_PASSWORD: "${MYSQL_SUPERPASS}"

    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 30s
      interval: 5s
      timeout: 5s
      retries: 5

    networks:
      - default

    volumes:
      - mariadb_data:/var/lib/mysql
      - ./database:/etc/mysql/conf.d:ro

  builder:
    profiles:
      - builder

    image: "ghcr.io/byloth/cmangos/${WOW_VERSION}/builder:latest"
    depends_on:
      mariadb:
        condition: service_healthy

    environment:
      MYSQL_SUPERUSER: root
      MYSQL_SUPERPASS: "${MYSQL_SUPERPASS}"
      MANGOS_DBHOST: mariadb
      MANGOS_DBUSER: "${MANGOS_DBUSER}"
      MANGOS_DBPASS: "${MANGOS_DBPASS}"

    networks:
      - default

    volumes:
      - mangosd_data:/home/mangos/data
      - type: bind
        source: "${WOW_CLIENT_DIR}"
        target: /home/mangos/wow-client

  mangosd:
    image: "ghcr.io/byloth/cmangos/${WOW_VERSION}:latest"
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy

    deploy:
      resources:
        limits:
          cpus: "${MANGOSD_CPUS_LIMIT:-0}"
          memory: "${MANGOSD_MEMORY_LIMIT:-8g}"

    environment:
      MANGOS_DBHOST: mariadb
      MANGOS_DBUSER: "${MANGOS_DBUSER}"
      MANGOS_DBPASS: "${MANGOS_DBPASS}"
      TZ: "${WOW_TIMEZONE}"

    command: mangosd
    stop_grace_period: 2m

    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/8085"]
      start_period: 10m
      interval: 30s
      timeout: 5s
      retries: 3

    stdin_open: true
    tty: true

    networks:
      - default

    ports:
      - "${MANGOSD_PORT:-8085}:8085"

    volumes:
      - mangosd_data:/var/lib/mangos:ro
      - ./runner/config:/opt/mangos/conf:ro

  realmd:
    image: "ghcr.io/byloth/cmangos/${WOW_VERSION}:latest"
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy

    deploy:
      resources:
        limits:
          cpus: "${REALMD_CPUS_LIMIT:-0}"
          memory: "${REALMD_MEMORY_LIMIT:-512m}"

    environment:
      MANGOS_DBHOST: mariadb
      MANGOS_DBUSER: "${MANGOS_DBUSER}"
      MANGOS_DBPASS: "${MANGOS_DBPASS}"
      TZ: "${WOW_TIMEZONE}"

    command: realmd
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/3724"]
      start_period: 30s
      interval: 30s
      timeout: 5s
      retries: 3

    networks:
      - default

    ports:
      - "${REALMD_PORT:-3724}:3724"

    volumes:
      - mangosd_data:/var/lib/mangos:ro

  phpmyadmin:
    profiles:
      - debug

    image: phpmyadmin:5.2
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy

    deploy:
      resources:
        limits:
          cpus: "${PHPMYADMIN_CPUS_LIMIT:-0}"
          memory: "${PHPMYADMIN_MEMORY_LIMIT:-512m}"

    environment:
      PMA_HOST: mariadb
      PMA_USER: root
      PMA_PASSWORD: "${MYSQL_SUPERPASS}"

    networks:
      - default

    ports:
      - "${PHPMYADMIN_PORT:-8080}:80"

networks:
  default:

volumes:
  mariadb_data:
  mangosd_data:
