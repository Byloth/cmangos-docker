###############################################
#  CMaNGOS AI Playerbot - Configuration file  #
###############################################

AiPlayerbot.Enabled = 1

# https://github.com/cmangos/issues/issues/3912
AiPlayerbot.RandomBotAutologin = 0

# Mass-login mitigation for the issue above: with the upstream defaults
# (1000 random bots, all logged in at startup) mangosd was seen to segfault
# ~110 seconds after startup. These values keep it stable in production and
# take effect as soon as `RandomBotAutologin` is turned on.
AiPlayerbot.MinRandomBots = 200
AiPlayerbot.MaxRandomBots = 200
AiPlayerbot.RandomBotLoginAtStartup = 0
AiPlayerbot.RandomBotsMaxLoginsPerInterval = 5
